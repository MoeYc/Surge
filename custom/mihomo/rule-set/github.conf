# GitHub rules. Static snapshot 2026-11-11 (Asia/Shanghai).
# Mihomo rule-provider uses behavior=classical and format=text.
# Community sources pinned at the revisions below.
# https://github.com/blackmatrix7/ios_rule_script/blob/0b6897dc17e0c513d25449c935a9694818e32f0c/rule/Clash/GitHub/GitHub.list
# https://github.com/ACL4SSR/ACL4SSR/blob/bdc102fc54ba64f6ecaf3c73248100fd7af32559/Clash/Ruleset/Github.list
# https://github.com/MetaCubeX/meta-rules-dat/blob/e731d6be701afb91548fe0b76380d5022f7f4c02/geo/geosite/github.list
# https://github.com/v2fly/domain-list-community/blob/2b7ae3222f79e58e323a6b1c30c6618821068963/data/github
# https://github.com/v2fly/domain-list-community/blob/2b7ae3222f79e58e323a6b1c30c6618821068963/data/github-copilot
# https://github.com/v2fly/domain-list-community/blob/2b7ae3222f79e58e323a6b1c30c6618821068963/data/npmjs
# Additional website, Copilot, Packages and Actions endpoints from GitHub.
# https://api.github.com/meta
# https://docs.github.com/en/rest/meta/meta#get-github-meta-information
# https://docs.github.com/en/copilot/reference/copilot-allowlist-reference
# Expanded v2fly github-copilot and npmjs includes.
# Matching uses known domains collected from the sources above.
# DOMAIN-SUFFIX covers the apex and its subdomains.
# Shared-cloud, CDN and CAPTCHA hosts use exact DOMAIN matching.
# Repeated rules and entries covered by a parent suffix are deduplicated.
# Rules total 195.

