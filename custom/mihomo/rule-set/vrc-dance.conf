# VRChat dance-world proxy candidates. Snapshot 2026-11-18 (Asia/Shanghai).
# Mihomo rule-provider: behavior: classical, format: text.
# https://wiki.metacubex.one/config/rule-providers/content/
# Attach a policy with RULE-SET,vrc-dance,<policy> in the consuming config.
# Only DOMAIN / DOMAIN-SUFFIX rules, without a policy column.
# Excludes VRChat platform/API/assets/Photon and YouTube dependencies.
# Mainland-direct services are omitted: Bilibili, its resolvers/images/media,
# and WannaDance (upstream documents that a proxy is generally unnecessary).
# https://github.com/wzhqwq/VRCDancePreloader/blob/42b31a657873db5592b7a3b54451164ccb02d90c/README.md
# No CloudFront distribution list: a CDN hostname alone does not justify proxying.
# No shared CDN/cloud or personal parent-domain suffixes.
# Remaining author hosts are routing candidates, not claims of nationwide blocking;
# mainland reachability varies by ISP. PyPy is explicitly retained by user choice.
# Historical entries below do not imply current availability.

# PyPyDance: dedicated dance domain covers API, catalog, thumbnails and CDN nodes.
# DOMAIN-SUFFIX matches the apex and every subdomain, including hashed CDN nodes.
# The old jd.pypy.moe API is outside pypy.dance and needs its own rule.
# https://github.com/wzhqwq/VRCDancePreloader/blob/42b31a657873db5592b7a3b54451164ccb02d90c/internal/utils/pypy.go
# https://github.com/wzhqwq/VRCDancePreloader/pull/12
DOMAIN-SUFFIX,pypy.dance
DOMAIN,jd.pypy.moe

# DuDu FitDance: catalog/thumbnails/video API, media CDN and observed legacy API.
# https://github.com/wzhqwq/VRCDancePreloader/blob/42b31a657873db5592b7a3b54451164ccb02d90c/internal/utils/dudu.go
# https://github.com/SW26010/still-wanna-dance/blob/d7be45246d572567935a288e5a9ec34d60ec660a/docs/evidence/playback-domain-20260926/game-log-domains.json
DOMAIN,api.dudufit.dance
DOMAIN,global-cdn.dudufit.dance
DOMAIN,api-ddfd.imkiva.com

# VRDancing: dedicated author domain for APIs, regional/LQ CDN and world resources.
# https://www.vrdancing.club/world/v400
# https://www.vrdancing.club/world/v530
# https://github.com/EllyVR/VRCVideoCacher/blob/5e433a6ebe39e860b1037a2547c71afaa2f70c63/VRCVideoCacher/Services/VRDancingAPIService.cs
# https://github.com/EllyVR/VRCVideoCacher/blob/5e433a6ebe39e860b1037a2547c71afaa2f70c63/VRCVideoCacher/YTDL/SiteHandlers/Sites/VRDancingHandler.cs
DOMAIN-SUFFIX,vrdancing.club

# Twitch: in-world live TV/chat API, HLS playlists/media and player assets.
# These service suffixes also match Twitch traffic outside dance worlds.
# https://www.vrdancing.club/world/v515
# https://www.vrdancing.club/world/v522
# https://github.com/yt-dlp/yt-dlp/blob/master/yt_dlp/extractor/twitch.py
# https://github.com/v2fly/domain-list-community/blob/e8a386f3327444cdd2c3318b94a0abd3804e62f4/data/twitch
# twitch.tv includes gql and irc-ws; ttvnw.net includes usher and HLS media.
# Optional extensions, conference sites, shared IVS and generic CDN lists omitted.
DOMAIN-SUFFIX,jtvnw.net
DOMAIN-SUFFIX,ttvnw.net
DOMAIN-SUFFIX,twitch.tv
DOMAIN-SUFFIX,twitchcdn.net
DOMAIN-SUFFIX,ext-twitch.tv
DOMAIN-SUFFIX,twitchsvc.net
