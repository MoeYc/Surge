# IP-CHECK rules. Static snapshot.
# Community base: https://github.com/v2fly/domain-list-community/blob/master/data/category-ip-geo-detect
# Includes data/ipip; snapshot 2026-10-19; supplemented with domestic sites and real API endpoints.
# API references: https://github.com/jason5ng32/MyIP/tree/main/frontend/utils/getips
# DOMAIN-SUFFIX covers the apex plus API, IPv4/IPv6, and regional subdomains.
# Scope reviewed 2026-10-30: dedicated IP lookup, IP reputation, and leak-test services.
# Shared-platform rules require a dedicated IP detection hostname (exact DOMAIN).
# Exclude DNS resolver hosts, general websites/APIs/toolboxes, speed tests, and shared CDNs.
# An IP lookup URL path does not justify routing every request to its hostname.

# .cn IP lookup sites and query hosts -- researched 2026-10-20.
# Source comments identify the official query page or the code/documentation using the API.
# Dedicated IP sites: match only the named domain and its subdomains.
# Shared sites/platforms: include only dedicated IP query hostnames (DOMAIN).
# No IP keywords, regular expressions, CN-wide suffixes, or general platform suffixes.

